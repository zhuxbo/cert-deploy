name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check agent and release governance
        run: |
          bash build/check-agent-config.sh
          bash build/test-release.sh

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Run golangci-lint (linux)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run golangci-lint (windows)
        uses: golangci/golangci-lint-action@v8
        env:
          GOOS: windows
          GOARCH: amd64
        with:
          version: v2.12.2
          args: --timeout=5m

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Run formal release build entry
        run: |
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          bash build/build.sh 0.0.0-ci.1 "$output_dir"
          expected=$'sslctl-linux-amd64\nsslctl-linux-amd64.gz\nsslctl-linux-arm64\nsslctl-linux-arm64.gz\nsslctl-windows-amd64.exe\nsslctl-windows-amd64.exe.gz'
          actual="$(find "$output_dir" -maxdepth 1 -type f -exec basename {} \; | sort)"
          test "$actual" = "$expected"
          "$output_dir/sslctl-linux-amd64" --version | grep -F '0.0.0-ci.1'
