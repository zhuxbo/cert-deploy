name: E2E Tests

on:
  push:
    branches: [dev]
    paths:
      - 'docker/test/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      distro:
        description: '发行版 (ubuntu/debian/alpine/rocky/all)'
        required: false
        default: 'all'
      server:
        description: '服务器类型 (nginx/apache/all)'
        required: false
        default: 'all'
      test:
        description: '测试文件 (setup/deploy/scan/docker-scan/.../all)'
        required: false
        default: 'all'
      dind:
        description: '运行 Docker-in-Docker 测试'
        required: false
        type: boolean
        default: true

jobs:
  e2e:
    name: E2E (${{ matrix.server }}-${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ !startsWith(github.event.inputs.test || '', 'docker-') }}

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ (github.event.inputs.distro || 'all') == 'all' && fromJSON('["ubuntu","debian","alpine","rocky"]') || fromJSON(format('["{0}"]', github.event.inputs.distro)) }}
        server: ${{ (github.event.inputs.server || 'all') == 'all' && fromJSON('["nginx","apache"]') || fromJSON(format('["{0}"]', github.event.inputs.server)) }}

    env:
      E2E_SERVER: ${{ matrix.server }}
      E2E_DISTRO: ${{ matrix.distro }}
      E2E_TEST: ${{ github.event.inputs.test || '' }}
      SSLCTL_E2E_PROJECT_NAME: sslctl-e2e-${{ github.run_id }}-${{ matrix.server }}-${{ matrix.distro }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Build sslctl binary
        run: |
          mkdir -p docker/test/build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags e2e -o docker/test/build/sslctl ./cmd/

      - name: Build Docker images
        working-directory: docker/test
        run: |
          COMPOSE_PROJECT_NAME="$SSLCTL_E2E_PROJECT_NAME" \
            docker compose build mock-api "${E2E_SERVER}-${E2E_DISTRO}"

      - name: Run E2E tests
        working-directory: docker/test
        run: |
          ARGS=(--no-build --no-dind --server "$E2E_SERVER" --distro "$E2E_DISTRO")
          if [ -n "$E2E_TEST" ] && [ "$E2E_TEST" != "all" ]; then
            ARGS+=(--test "$E2E_TEST")
          fi
          bash scripts/run-tests.sh "${ARGS[@]}"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.server }}-${{ matrix.distro }}
          path: docker/test/reports/
          retention-days: 7

      - name: Cleanup
        if: always()
        working-directory: docker/test
        run: COMPOSE_PROJECT_NAME="$SSLCTL_E2E_PROJECT_NAME" docker compose down -v --remove-orphans

  dind:
    name: E2E (Docker-in-Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' || startsWith(github.event.inputs.test || '', 'docker-') || ((github.event.inputs.test == 'all' || github.event.inputs.test == '') && github.event.inputs.dind == 'true') }}

    env:
      E2E_TEST: ${{ github.event.inputs.test || '' }}
      SSLCTL_E2E_PROJECT_NAME: sslctl-e2e-${{ github.run_id }}-dind

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Build sslctl binary
        run: |
          mkdir -p docker/test/build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags e2e -o docker/test/build/sslctl ./cmd/

      - name: Build Docker images
        working-directory: docker/test
        run: COMPOSE_PROJECT_NAME="$SSLCTL_E2E_PROJECT_NAME" docker compose build mock-api dind

      - name: Run E2E tests
        working-directory: docker/test
        run: |
          ARGS=(--no-build --dind-only)
          if [[ "$E2E_TEST" == docker-* ]]; then
            ARGS+=(--test "$E2E_TEST")
          fi
          bash scripts/run-tests.sh "${ARGS[@]}"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-dind
          path: docker/test/reports/
          retention-days: 7

      - name: Cleanup
        if: always()
        working-directory: docker/test
        run: COMPOSE_PROJECT_NAME="$SSLCTL_E2E_PROJECT_NAME" docker compose down -v --remove-orphans
