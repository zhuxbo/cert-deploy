name: E2E Tests

on:
  push:
    branches: [dev]
    paths:
      - 'docker/test/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      distro:
        description: '发行版 (ubuntu/debian/alpine/rocky/all)'
        required: false
        default: 'all'
      server:
        description: '服务器类型 (nginx/apache/all)'
        required: false
        default: 'all'
      test:
        description: '测试文件 (setup/deploy/scan/.../all)'
        required: false
        default: 'all'
      dind:
        description: '运行 Docker-in-Docker 测试'
        required: false
        type: boolean
        default: false

jobs:
  e2e:
    name: E2E (${{ matrix.server }}-${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ (github.event.inputs.distro || 'all') == 'all' && fromJSON('["ubuntu","debian","alpine","rocky"]') || fromJSON(format('["{0}"]', github.event.inputs.distro)) }}
        server: ${{ (github.event.inputs.server || 'all') == 'all' && fromJSON('["nginx","apache"]') || fromJSON(format('["{0}"]', github.event.inputs.server)) }}

    env:
      E2E_SERVER: ${{ matrix.server }}
      E2E_DISTRO: ${{ matrix.distro }}
      E2E_TEST: ${{ github.event.inputs.test || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Build sslctl binary
        run: |
          mkdir -p docker/test/build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags e2e -o docker/test/build/sslctl ./cmd/

      - name: Build Docker images
        working-directory: docker/test
        run: |
          docker compose build mock-api "${E2E_SERVER}-${E2E_DISTRO}"

      - name: Start services
        working-directory: docker/test
        run: |
          docker compose up -d mock-api "${E2E_SERVER}-${E2E_DISTRO}"
          # 等待 mock-api 健康
          for i in $(seq 1 30); do
            if docker compose exec mock-api wget -q --spider http://localhost:8080/health 2>/dev/null; then
              echo "mock-api ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: mock-api health check timeout"
              exit 1
            fi
            sleep 1
          done

      - name: Install binary and start web server
        working-directory: docker/test
        run: |
          SERVICE="${E2E_SERVER}-${E2E_DISTRO}"

          # 复制二进制到可写路径（volume 为只读暂存，upgrade 测试需要可写）
          docker compose exec "$SERVICE" cp /opt/sslctl-binary /usr/local/bin/sslctl
          docker compose exec "$SERVICE" chmod +x /usr/local/bin/sslctl

          # 启动 web 服务器
          if [ "$E2E_SERVER" = "nginx" ]; then
            docker compose exec "$SERVICE" nginx || true
          else
            docker compose exec "$SERVICE" bash -c 'command -v apache2ctl && apache2ctl start || httpd' || true
          fi
          sleep 2

          # 验证 mock-api 连通性（硬失败）
          echo "=== Verifying mock-api connectivity from test container ==="
          docker compose exec "$SERVICE" curl -sf --max-time 5 http://mock-api:8080/health

          # 启动 socat 代理并验证 localhost 连通性（硬失败）
          echo "=== Starting socat proxy and verifying localhost connectivity ==="
          docker compose exec -d "$SERVICE" socat TCP-LISTEN:8080,fork,reuseaddr TCP:mock-api:8080
          sleep 2
          docker compose exec "$SERVICE" curl -sf --max-time 5 http://localhost:8080/health

          # 验证 sslctl 可执行（硬失败）
          echo "=== Verifying sslctl ==="
          docker compose exec "$SERVICE" sslctl version

      - name: Run Bats tests
        working-directory: docker/test
        run: |
          SERVICE="${E2E_SERVER}-${E2E_DISTRO}"
          mkdir -p reports

          if [ "$E2E_TEST" = "all" ] || [ -z "$E2E_TEST" ]; then
            docker compose exec "$SERVICE" bats --tap \
              /tests/setup.bats \
              /tests/scan.bats \
              /tests/deploy.bats \
              /tests/deploy-local.bats \
              /tests/status.bats \
              /tests/rollback.bats \
              /tests/daemon.bats \
              /tests/upgrade.bats \
              /tests/uninstall.bats \
              | tee "reports/${E2E_SERVER}-${E2E_DISTRO}.tap"
          else
            docker compose exec "$SERVICE" bats --tap "/tests/${E2E_TEST}.bats" \
              | tee "reports/${E2E_SERVER}-${E2E_DISTRO}.tap"
          fi

      - name: Collect logs on failure
        if: failure()
        working-directory: docker/test
        run: |
          SERVICE="${E2E_SERVER}-${E2E_DISTRO}"
          mkdir -p reports
          docker compose logs "$SERVICE" > "reports/${SERVICE}-container.log" 2>&1 || true
          docker compose logs mock-api > "reports/${SERVICE}-mock-api.log" 2>&1 || true
          docker compose exec "$SERVICE" bash -c 'cat /opt/sslctl/logs/*.log 2>/dev/null' > "reports/${SERVICE}-sslctl.log" 2>/dev/null || true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.server }}-${{ matrix.distro }}
          path: docker/test/reports/
          retention-days: 7

      - name: Cleanup
        if: always()
        working-directory: docker/test
        run: docker compose down -v

  dind:
    name: E2E (Docker-in-Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.dind == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Build sslctl binary
        run: |
          mkdir -p docker/test/build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags e2e -o docker/test/build/sslctl ./cmd/

      - name: Build Docker images
        working-directory: docker/test
        run: docker compose build mock-api dind

      - name: Start services
        working-directory: docker/test
        run: |
          docker compose up -d mock-api dind
          # 等待 dind 内 docker daemon 就绪
          for i in $(seq 1 30); do
            if docker compose exec dind docker info >/dev/null 2>&1; then
              echo "dind ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: dind docker daemon timeout"
              exit 1
            fi
            sleep 2
          done

      - name: Install binary
        working-directory: docker/test
        run: |
          docker compose exec dind cp /opt/sslctl-binary /usr/local/bin/sslctl
          docker compose exec dind chmod +x /usr/local/bin/sslctl

      - name: Run Docker scan tests
        working-directory: docker/test
        run: |
          mkdir -p reports
          docker compose exec dind bats --tap /tests/docker-scan.bats \
            | tee reports/dind.tap

      - name: Collect logs on failure
        if: failure()
        working-directory: docker/test
        run: |
          mkdir -p reports
          docker compose logs dind > reports/dind-container.log 2>&1 || true
          docker compose logs mock-api > reports/dind-mock-api.log 2>&1 || true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-dind
          path: docker/test/reports/
          retention-days: 7

      - name: Cleanup
        if: always()
        working-directory: docker/test
        run: docker compose down -v
